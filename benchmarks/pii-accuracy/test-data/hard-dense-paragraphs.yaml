cases:
  # Dense multi-entity paragraphs (name + email + phone/IP + VAT/IBAN in the
  # same block), the failure mode where PERSON confidence drops under the
  # 0.95 floor even though the same names score 0.98-0.99 in isolation.
  # Report-only (category: hard) until the floor is recalibrated on evidence.
  # All names, domains, IPs, IBANs, and VAT numbers below are synthetic:
  # invented names, example.com/exemple-corp.fr domains, documentation/private
  # IP ranges, and IBAN/VAT numbers generated to pass their real checksums
  # without corresponding to any real account.

  - id: hard_dense_fr_client_sheet_compound_1
    suite: hard
    category: hard
    split: test
    language: fr
    text: "Fiche client : Jean-Baptiste Moreau, agence de Rennes. Contact : jean-baptiste.moreau@exemple-corp.fr, tel +33 1 42 68 53 09. Derniere connexion depuis 192.0.2.14. Numero de TVA intracommunautaire FR57482910635."
    expected:
      - entity: PERSON
        text: Jean-Baptiste Moreau
        match: contains
      - entity: LOCATION
        text: Rennes
        match: contains
      - entity: EMAIL_ADDRESS
        text: jean-baptiste.moreau@exemple-corp.fr
        match: exact
      - entity: PHONE_NUMBER
        text: +33 1 42 68 53 09
        match: contains
      - entity: IP_ADDRESS
        text: 192.0.2.14
        match: exact
      - entity: VAT_CODE
        text: FR57482910635
        match: exact

